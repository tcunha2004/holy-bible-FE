@if (open()) {
  <div
    class="fixed inset-0 z-60 flex items-end sm:items-center justify-center sm:p-6"
    role="dialog"
    aria-modal="true"
    aria-labelledby="service-unavailable-title"
  >
    <div
      class="absolute inset-0 bg-[#1d1d1f]/40 backdrop-blur-sm animate-fade-in"
      (click)="close()"
    ></div>

    <div
      class="relative w-full sm:max-w-lg max-h-[88dvh] sm:max-h-[85dvh] flex flex-col bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl shadow-gray-900/10 overflow-hidden animate-fade-in-up"
    >
      <div class="relative px-6 pt-7 pb-5 sm:px-8 sm:pt-8 border-b border-gray-100">
        <div class="sm:hidden w-10 h-1 rounded-full bg-gray-200 mx-auto mb-5"></div>

        <button
          (click)="close()"
          class="absolute top-5 right-5 sm:top-6 sm:right-6 flex items-center justify-center w-9 h-9 rounded-full text-gray-400 hover:text-[#1d1d1f] hover:bg-gray-50 transition-colors cursor-pointer"
          aria-label="Fechar"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <span class="block text-xs font-semibold tracking-[0.2em] text-gold uppercase mb-2">
          Aviso
        </span>
        <h2
          id="service-unavailable-title"
          class="text-2xl font-bold tracking-tight text-[#1d1d1f] leading-tight pr-10"
        >
          Sistema temporariamente fora do ar
        </h2>
        <p class="text-sm text-gray-400 leading-relaxed mt-1.5">
          Nossos serviços estão indisponíveis no momento.
        </p>
      </div>

      <div class="flex-1 overflow-y-auto px-6 py-5 sm:px-8 sm:py-6">
        <div class="flex items-start gap-4">
          <span
            class="flex items-center justify-center w-11 h-11 shrink-0 rounded-2xl bg-primary/10 text-primary"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.6"
                d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"
              />
            </svg>
          </span>

          <div class="min-w-0 pt-0.5">
            <h3 class="text-sm font-semibold text-[#1d1d1f] leading-snug">
              Estamos trabalhando nisso
            </h3>
            <p class="text-sm text-gray-400 leading-relaxed mt-1">
              A indisponibilidade é temporária e já estamos cuidando disso, obrigado pela compreensão.
            </p>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 sm:px-8 sm:py-5 border-t border-gray-100">
        <button
          (click)="close()"
          class="w-full bg-primary text-white py-3.5 rounded-full text-sm font-semibold hover:bg-primary-dark transition-colors cursor-pointer"
        >
          Entendi
        </button>
      </div>
    </div>
  </div>
}

<div class="min-h-dvh bg-white flex items-center justify-center px-6 py-16">
  <a
    routerLink="/welcome"
    class="absolute top-8 left-8 flex items-center gap-2 text-xs text-gray-400 hover:text-[#1d1d1f] transition-colors group"
  >
    <svg
      class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
      />
    </svg>
    Voltar
  </a>

  <div class="w-full max-w-sm">
    <div class="text-center mb-10">
      <h1 class="text-2xl font-bold text-[#1d1d1f] tracking-tight mt-6 mb-2">Crie sua conta</h1>
      <p class="text-sm text-gray-400">Comece sua jornada espiritual hoje.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-500 tracking-wide">Nome</label>
        <input
          formControlName="name"
          type="text"
          placeholder="Seu nome"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-500 tracking-wide">Email</label>
        <input
          formControlName="email"
          type="email"
          placeholder="seu@email.com"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-500 tracking-wide">Senha</label>
        <div class="relative">
          <input
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-11 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
          />
          <button
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            class="absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-400 hover:text-[#1d1d1f] transition-colors cursor-pointer"
          >
            @if (showPassword()) {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-500 tracking-wide">Confirmar senha</label>
        <div class="relative">
          <input
            formControlName="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-11 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
          />
          <button
            type="button"
            (click)="toggleConfirmPassword()"
            [attr.aria-label]="showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            class="absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-400 hover:text-[#1d1d1f] transition-colors cursor-pointer"
          >
            @if (showConfirmPassword()) {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      @if (showErrorModal()) {
        <div
          class="bg-red-50 border border-red-100 rounded-xl px-4 py-3 flex items-start justify-between gap-3"
        >
          <ul class="flex flex-col gap-1.5">
            @for (err of modalErrors(); track err) {
              <li class="text-xs text-red-500">{{ err }}</li>
            }
          </ul>
        </div>
      }

      @if (error()) {
        <p class="text-xs text-red-400 text-center">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-primary text-white cursor-pointer py-3.5 rounded-xl text-sm font-semibold hover:bg-primary-dark transition-colors mt-2 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ loading() ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-8">
      Já tem uma conta?
      <a
        routerLink="/auth/login"
        class="text-primary font-medium hover:text-primary-dark transition-colors ml-1"
      >
        Entrar
      </a>
    </p>
  </div>
</div>

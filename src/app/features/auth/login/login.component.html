<div class="min-h-screen bg-white flex items-center justify-center px-6">

  <a
    routerLink="/welcome"
    class="absolute top-8 left-8 flex items-center gap-2 text-xs text-gray-400 hover:text-[#1d1d1f] transition-colors group"
  >
    <svg
      class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
      />
    </svg>
    Voltar
  </a>

  <div class="w-full max-w-sm">
    <div class="text-center mb-10">
      <h1 class="text-2xl font-bold text-[#1d1d1f] tracking-tight mt-6 mb-2">Bem-vindo de volta</h1>
      <p class="text-sm text-gray-400">Entre para continuar sua jornada.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-500 tracking-wide">Email</label>
        <input
          formControlName="email"
          type="email"
          placeholder="seu@email.com"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-medium text-gray-500 tracking-wide">Senha</label>
          <a href="#" class="text-xs text-primary hover:text-primary-dark transition-colors">Esqueceu a senha?</a>
        </div>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-[#1d1d1f] placeholder:text-gray-300 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"
        />
      </div>

      @if (showErrorModal) {
        <div class="bg-red-50 border border-red-100 rounded-xl px-4 py-3">
          <ul class="flex flex-col gap-1.5">
            @for (err of modalErrors; track err) {
              <li class="text-xs text-red-500">{{ err }}</li>
            }
          </ul>
        </div>
      }

      @if (error) {
        <p class="text-xs text-red-400 text-center">{{ error }}</p>
      }

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-primary text-white cursor-pointer py-3.5 rounded-xl text-sm font-semibold hover:bg-primary-dark transition-colors mt-2 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-8">
      Não tem uma conta?
      <a routerLink="/auth/register" class="text-primary font-medium hover:text-primary-dark transition-colors ml-1">
        Criar conta
      </a>
    </p>
  </div>
</div>

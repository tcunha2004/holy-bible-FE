<header class="fixed top-0 inset-x-0 z-50 bg-white border-b border-gray-100">
  <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
    <span class="text-lg font-bold text-[#1d1d1f] tracking-tight">Holy</span>

    <div class="flex items-center gap-1">
      <button
        (click)="openGuide()"
        class="flex items-center justify-center w-9 h-9 rounded-full text-gray-400 hover:text-[#1d1d1f] hover:bg-gray-50 transition-colors cursor-pointer"
        aria-label="Como usar a plataforma"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"
          />
        </svg>
      </button>

      <div class="relative">
        <button
          (click)="menuOpen.set(!menuOpen())"
          class="flex items-center justify-center w-9 h-9 rounded-full text-gray-400 hover:text-[#1d1d1f] hover:bg-gray-50 transition-colors cursor-pointer"
          aria-label="Menu do usuário"
        >
        <svg
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="fixed inset-0 z-10" (click)="menuOpen.set(false)"></div>

        <div
          class="absolute right-0 top-full mt-2 z-20 w-60 bg-white rounded-2xl border border-gray-100 shadow-lg shadow-gray-200/50 overflow-hidden"
        >
          @if (userName) {
            <div class="flex items-center gap-3 px-4 py-3.5 bg-gray-50/60">
              <span
                class="flex items-center justify-center w-9 h-9 shrink-0 rounded-full bg-primary/10 text-primary text-xs font-semibold"
              >
                {{ userInitials }}
              </span>
              <div class="min-w-0">
                <p class="text-[11px] text-gray-400 leading-tight">Olá,</p>
                <p class="text-sm font-semibold text-[#1d1d1f] leading-tight truncate">
                  {{ userName }}
                </p>
              </div>
            </div>

            <div class="h-px bg-gray-100"></div>
          }

          <div class="p-1.5">
            <button
              (click)="logout()"
              class="w-full flex items-center gap-2.5 text-left px-3 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50 cursor-pointer"
            >
              <svg
                class="w-4 h-4 shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
                />
              </svg>
              Sair
            </button>
          </div>
        </div>
      }
      </div>
    </div>
  </div>
</header>

<div class="pt-14">
  <router-outlet />
</div>

<app-how-to-use-modal />
